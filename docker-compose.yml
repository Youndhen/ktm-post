# Runs the Next.js app only. The database stays on hosted Neon, so the
# connection string is supplied through the environment.
#
# Compose automatically reads ./.env for the ${...} substitutions below.
#   docker compose build
#   docker compose up -d
#   docker compose logs -f web

services:
  web:
    build:
      context: .
      # "/" and "/news" are statically generated from the database, and
      # NEXT_PUBLIC_* is inlined into the client bundle, so both are
      # needed at build time as well as at run time.
      args:
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    image: ktm-post:latest
    container_name: ktm-post
    ports:
      # Override the host port with APP_PORT if 3000 is busy (e.g. "next dev").
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
    restart: unless-stopped
